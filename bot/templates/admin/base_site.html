{% extends "admin/base.html" %}
{% load i18n static %}

{% block extrahead %}
  {{ block.super }}
  <link rel="icon" href="{% static 'bot/onma.png' %}">
  <link rel="stylesheet" href="{% static 'admin/onma_admin.css' %}">
{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}" class="onma-admin-brand">
    <img src="{% static 'bot/onma.png' %}" alt="" class="onma-admin-logo">
    {{ site_header|default:_('Django administration') }}
  </a>
</div>
{% if user.is_anonymous %}
  {% include "admin/color_theme_toggle.html" %}
{% endif %}
{% endblock %}
